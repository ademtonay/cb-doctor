services:
  couchbase:
    image: couchbase:community
    container_name: cb
    hostname: cb
    restart: unless-stopped

    environment:
      - TZ=Europe/Istanbul

    ports:
      # Admin / REST / UI
      - "8091:8091" # Web UI (Cluster Manager)
      - "8092:8092" # Views
      - "8093:8093" # Query (N1QL)
      - "8094:8094" # Search (FTS)
      - "8095:8095" # Analytics
      - "8096:8096" # Eventing
      # Data
      - "11210:11210" # KV
      # TLS (optional)
      - "18091:18091"
      - "18092:18092"
      - "18093:18093"
      - "18094:18094"
      - "18095:18095"
      - "18096:18096"

    volumes:
      - cb-data:/opt/couchbase/var

volumes:
  cb-data:
